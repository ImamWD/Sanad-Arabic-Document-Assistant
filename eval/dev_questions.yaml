    expected_citations:
      - {file: yep-final-evaluation-2022.pdf, page: 2}
      - {file: yep-final-evaluation-2022.pdf, page: 6}
    expected_outcome: answered
    expected_answer: "نحو 1,910 دولارات أمريكية لكل فرصة عمل (إجمالي الإنفاق 2,870,000 مقسوماً على 1,503 ملتحقين بالعمل)."
    vocab_shift: true
    notes: "The evaluation calls this كلفة الفرصة الوظيفية الواحدة (p2 summary, p6 efficiency section). The question asks about spending per young person who got a job instead."

[project]
name = "sanad-ml"
version = "0.1.0"
description = "Sanad embedding and rerank service (M0: health stub, no models yet)"
requires-python = "==3.12.*"
# Direct dependencies are pinned exactly; uv.lock pins the full tree.
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.uv]
# The code is run from PYTHONPATH=/app/ml, not installed into the venv.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-p", "no:cacheprovider"]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["sanad_ml", "tests"]
cache_dir = "/tmp/mypy_cache"

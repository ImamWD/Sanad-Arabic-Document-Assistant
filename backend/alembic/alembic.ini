# Alembic config. Run from backend/:  alembic -c alembic/alembic.ini upgrade head
# The database URL is not set here: env.py reads it from sanad.core.config (POSTGRES_* vars).
# Revision ids are fixed by the roadmap: 0001_core (B2), 0002_documents (B3), 0003_queries (R1).

[alembic]
script_location = %(here)s
file_template = %%(rev)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

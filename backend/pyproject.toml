[project]
name = "sanad"
version = "0.1.0"
description = "Sanad API and ingestion worker"
requires-python = "==3.12.*"
# Direct dependencies are pinned exactly; uv.lock pins the full tree.
dependencies = [
    "fastapi==0.162.0",
    "httpx2==2.16.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "sqlalchemy[asyncio]==2.1.6",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]

[tool.uv]
# The code is run from PYTHONPATH=/app/backend, not installed into the venv.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-p", "no:cacheprovider"]
filterwarnings = ["error"]

# backend-dev sets COVERAGE_RCFILE to this file, so these settings also apply when pytest runs
# from the repo root (e.g. `pytest backend/tests/text --cov=sanad.text --cov-fail-under=100`).
[tool.coverage.run]
branch = true
data_file = "/tmp/.coverage"

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["sanad", "tests"]
cache_dir = "/tmp/mypy_cache"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Sanad: base stack. `docker compose up -d --build` runs the whole system from a clean checkout.
#
# Isolation: every container that touches document content (db, api, worker, ml, ollama) is on
# the `backend` network only, which is `internal: true` and has no route to the internet.
# `web` is the one published port. The egress guarantee is tested against THIS file alone.
# Do not add a docker-compose.override.yml: compose loads it automatically.
#
# Containers with internet access in this file (all non-internal networks):
#   web   (edge)    serves the SPA and proxies /api; makes no outbound calls itself
#   node  (egress)  tools profile; npm registry; mounts frontend/ only
#   e2e   (edge)    tools profile; Playwright; mounts frontend/ only
#   ollama-init (egress)  one-shot; pulls LLM weights into `ollama_models`; never sees a prompt
# backend-dev and ml-dev are on `backend` (no internet); render has no network at all.
#
# docker-compose.dev.yml is the development override (relaxes isolation; see that file).
# docker-compose.api-llm.yml lets api reach a hosted LLM: synthetic seed data only, never on a
# server that holds client documents (see that file). Not here yet: docker-compose.gpu.yml.
#
# Settings come from .env if it exists (copy .env.example); every value has a default.
#
# Instances: SANAD_INSTANCE (default `sanad`) is the compose project name and the tag of every
# image built here, so volumes, networks, containers and images of two instances never mix.
# The Makefile picks `sanad-<dir>` inside a git worktree; set it yourself otherwise, e.g.
#   SANAD_INSTANCE=sanad-demo WEB_PORT=8081 docker compose up -d --build

name: ${SANAD_INSTANCE:-sanad}

x-env-file: &env-file
  env_file:
    - path: .env
      required: false

# api, worker and backend-dev. The app builds the database URL from these parts itself
# (sanad.core.config), so the password may contain any character.
x-backend-env: &backend-env
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:-sanad}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanad}
  POSTGRES_DB: ${POSTGRES_DB:-sanad}
  ML_BASE_URL: ${ML_BASE_URL:-http://ml:8001}

x-backend-build: &backend-build
  context: ./backend
  target: runtime

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sanad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanad}
      POSTGRES_DB: ${POSTGRES_DB:-sanad}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ml:
    build:
      context: ./ml
      target: runtime
    image: sanad-ml:${SANAD_INSTANCE:-sanad}
    <<: *env-file
    init: true
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      # B3: healthy once both int8 models are loaded (~10 s; longer on a slow disk).
      start_period: 60s
    restart: unless-stopped

  # One-shot: migrate the schema, then run the idempotent init steps (programmes, demo
  # accounts; later tasks append steps). Runs on every `up`; api and worker wait for it.
  # alembic/ and seed/ are not baked into the runtime image, so they are mounted read-only.
  # `files` is the document store api and worker share; B3's seed step copies into it.
  init:
    build: *backend-build
    image: sanad-backend:${SANAD_INSTANCE:-sanad}
    <<: *env-file
    init: true
    command: ["sh", "-c", "alembic -c alembic/alembic.ini upgrade head && python -m sanad.init"]
    environment:
      <<: *backend-env
      FILES_DIR: /data/files
    volumes:
      - ./backend/alembic:/app/backend/alembic:ro
      - ./seed:/app/seed:ro
      - files:/data/files
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: *backend-build
    image: sanad-backend:${SANAD_INSTANCE:-sanad}
    <<: *env-file
    init: true
    environment:
      <<: *backend-env
      FILES_DIR: /data/files
    # B3: uploads are written here; the worker reads them and writes the PDF renditions.
    volumes:
      - files:/data/files
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_healthy
      init:
        condition: service_completed_successfully
      # The model must be in place before the first question. On first boot that waits for
      # the download; afterwards ollama-init finds the model and exits at once, offline too.
      ollama-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  worker:
    build: *backend-build
    image: sanad-backend:${SANAD_INSTANCE:-sanad}
    <<: *env-file
    init: true
    command: ["python", "-m", "sanad.worker"]
    environment:
      <<: *backend-env
      FILES_DIR: /data/files
    # B3: originals in, PDF renditions out (shared with api and init).
    volumes:
      - files:/data/files
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Local generation (DECISIONS D3), the only LLM used for real documents. It receives every
  # prompt, so it is on the internal network only. Weights come from `ollama_models`.
  ollama:
    image: ollama/ollama:0.40.10
    init: true
    environment:
      # One request at a time and one model in memory: each parallel slot adds a KV cache (S3).
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama_models:/root/.ollama
    networks: [backend]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # One-shot, on every `up`: make sure the configured model is in `ollama_models`, then exit.
  # Runs its own private Ollama on the egress network and never sees a prompt. If the model is
  # already there it needs no network, so offline restarts work. The default is S3's text-only
  # gemma4:e4b build (deploy/ollama-init.sh). The defaults of LLM_MODEL and OLLAMA_BASE_MODEL
  # must match backend/sanad/llm/settings.py (a test checks).
  ollama-init:
    image: ollama/ollama:0.40.10
    init: true
    entrypoint: ["/bin/sh", "/opt/sanad/ollama-init.sh"]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-sanad-gemma4-e4b-text}
      OLLAMA_BASE_MODEL: ${OLLAMA_BASE_MODEL:-gemma4:e4b-it-qat}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
    volumes:
      - ollama_models:/root/.ollama
      - ./deploy/ollama-init.sh:/opt/sanad/ollama-init.sh:ro
    networks: [egress]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Digits in the Arabic UI: latn (default) or arab. Baked in at build time.
        VITE_AR_NUMBERING: ${AR_NUMBERING:-latn}
    image: sanad-web:${SANAD_INSTANCE:-sanad}
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks: [edge, backend]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------
  # Developer tools (profile `tools`). Never started by `up`; used by the Makefile through
  # `docker compose run --rm <service> …`. They bind-mount the repo, so they always see the
  # working tree (including uncommitted files).
  # ---------------------------------------------------------------------------------------

  backend-dev:
    profiles: [tools]
    build:
      context: ./backend
      target: dev
    image: sanad-backend-dev:${SANAD_INSTANCE:-sanad}
    # Repo root, so roadmap commands like `pytest backend/tests/...` or
    # `python scripts/check_eval.py eval/...` work as written. The Makefile passes -w.
    working_dir: /app
    volumes:
      - .:/app
    <<: *env-file
    # Same database and ml wiring as api, so DB-backed tests (B2, B3) work out of the box.
    environment:
      <<: *backend-env
      LOG_LEVEL: WARNING
      # Coverage settings (branch = true, …) apply whatever the working directory.
      COVERAGE_RCFILE: /app/backend/pyproject.toml
    depends_on:
      db:
        condition: service_healthy
    # Internal network: tests reach db, never the internet.
    networks: [backend]

  ml-dev:
    profiles: [tools]
    build:
      context: ./ml
      target: dev
    image: sanad-ml-dev:${SANAD_INSTANCE:-sanad}
    working_dir: /app
    volumes:
      - .:/app
    networks: [backend]

  node:
    profiles: [tools]
    image: node:24.22.1-trixie-slim
    working_dir: /app/frontend
    # Only frontend/ is mounted: this container has internet access (npm registry), so it must
    # never see data/, .env or anything else outside the frontend source.
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      CI: ${CI:-}
      npm_config_update_notifier: "false"
      npm_config_fund: "false"
    networks: [egress]

  e2e:
    profiles: [tools]
    # Must match the @playwright/test version in frontend/package.json.
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /app/frontend
    # Only frontend/ is mounted (the edge network has internet access).
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      CI: ${CI:-}
      E2E_BASE_URL: http://web:8080
      npm_config_update_notifier: "false"
    ipc: host
    # Reaches the running stack through `web`, like a browser would.
    networks: [edge]

  render:
    profiles: [tools]
    build: ./tools/render
    image: sanad-render:${SANAD_INSTANCE:-sanad}
    working_dir: /app
    volumes:
      - .:/app
    # Renders local files only; no network at all.
    network_mode: none

networks:
  backend:
    internal: true
  # Published network for web (and the e2e browser that talks to it). Has internet access.
  edge: {}
  # Internet access for containers that never see document content: the node tools
  # container, ollama-init (pulls weights), and api only in the opt-in API-LLM override.
  egress: {}

volumes:
  db_data:
  # Uploaded documents and their PDF renditions (init, api, worker).
  files:
  # LLM weights (ollama, ollama-init). Weights only, never document content, so every instance
  # on this machine shares one copy instead of pulling several GB each. A clean-machine test
  # can give itself a fresh one with OLLAMA_MODELS_VOLUME.
  ollama_models:
    name: ${OLLAMA_MODELS_VOLUME:-sanad-ollama-models}
  frontend_node_modules:

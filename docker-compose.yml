# Sanad: base stack. `docker compose up -d --build` runs the whole system from a clean checkout.
#
# Isolation: every container that touches document content (db, api, worker, ml) is on the
# `backend` network only, which is `internal: true` and has no route to the internet.
# `web` is the one published port. The egress guarantee is tested against THIS file alone.
# Do not add a docker-compose.override.yml: compose loads it automatically.
#
# Containers with internet access in this file (all non-internal networks):
#   web   (edge)    serves the SPA and proxies /api; makes no outbound calls itself
#   node  (egress)  tools profile; npm registry; mounts frontend/ only
#   e2e   (edge)    tools profile; Playwright; mounts frontend/ only
# backend-dev and ml-dev are on `backend` (no internet); render has no network at all.
#
# docker-compose.dev.yml is the development override (relaxes isolation; see that file).
# Not here yet (later tasks): ollama, ollama-init, init, and the opt-in override files
# docker-compose.api-llm.yml and docker-compose.gpu.yml.
#
# Settings come from .env if it exists (copy .env.example); every value has a default.
#
# Instances: SANAD_INSTANCE (default `sanad`) is the compose project name and the tag of every
# image built here, so volumes, networks, containers and images of two instances never mix.
# The Makefile picks `sanad-<dir>` inside a git worktree; set it yourself otherwise, e.g.
#   SANAD_INSTANCE=sanad-demo WEB_PORT=8081 docker compose up -d --build

name: ${SANAD_INSTANCE:-sanad}

x-env-file: &env-file
  env_file:
    - path: .env
      required: false

# api, worker and backend-dev. The app builds the database URL from these parts itself
# (sanad.core.config), so the password may contain any character.
x-backend-env: &backend-env
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:-sanad}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanad}
  POSTGRES_DB: ${POSTGRES_DB:-sanad}
  ML_BASE_URL: ${ML_BASE_URL:-http://ml:8001}

x-backend-build: &backend-build
  context: ./backend
  target: runtime

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sanad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanad}
      POSTGRES_DB: ${POSTGRES_DB:-sanad}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ml:
    build:
      context: ./ml
      target: runtime
    image: sanad-ml:${SANAD_INSTANCE:-sanad}
    <<: *env-file
    init: true
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  api:
    build: *backend-build
    image: sanad-backend:${SANAD_INSTANCE:-sanad}
    <<: *env-file
    init: true
    environment: *backend-env
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  worker:
    build: *backend-build
    image: sanad-backend:${SANAD_INSTANCE:-sanad}
    <<: *env-file
    init: true
    command: ["python", "-m", "sanad.worker"]
    environment: *backend-env
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: sanad-web:${SANAD_INSTANCE:-sanad}
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks: [edge, backend]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------
  # Developer tools (profile `tools`). Never started by `up`; used by the Makefile through
  # `docker compose run --rm <service> …`. They bind-mount the repo, so they always see the
  # working tree (including uncommitted files).
  # ---------------------------------------------------------------------------------------

  backend-dev:
    profiles: [tools]
    build:
      context: ./backend
      target: dev
    image: sanad-backend-dev:${SANAD_INSTANCE:-sanad}
    # Repo root, so roadmap commands like `pytest backend/tests/...` or
    # `python scripts/check_eval.py eval/...` work as written. The Makefile passes -w.
    working_dir: /app
    volumes:
      - .:/app
    <<: *env-file
    # Same database and ml wiring as api, so DB-backed tests (B2, B3) work out of the box.
    environment:
      <<: *backend-env
      LOG_LEVEL: WARNING
      # Coverage settings (branch = true, …) apply whatever the working directory.
      COVERAGE_RCFILE: /app/backend/pyproject.toml
    depends_on:
      db:
        condition: service_healthy
    # Internal network: tests reach db, never the internet.
    networks: [backend]

  ml-dev:
    profiles: [tools]
    build:
      context: ./ml
      target: dev
    image: sanad-ml-dev:${SANAD_INSTANCE:-sanad}
    working_dir: /app
    volumes:
      - .:/app
    networks: [backend]

  node:
    profiles: [tools]
    image: node:24.22.1-trixie-slim
    working_dir: /app/frontend
    # Only frontend/ is mounted: this container has internet access (npm registry), so it must
    # never see data/, .env or anything else outside the frontend source.
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      CI: ${CI:-}
      npm_config_update_notifier: "false"
      npm_config_fund: "false"
    networks: [egress]

  e2e:
    profiles: [tools]
    # Must match the @playwright/test version in frontend/package.json.
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /app/frontend
    # Only frontend/ is mounted (the edge network has internet access).
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      CI: ${CI:-}
      E2E_BASE_URL: http://web:8080
      npm_config_update_notifier: "false"
    ipc: host
    # Reaches the running stack through `web`, like a browser would.
    networks: [edge]

  render:
    profiles: [tools]
    build: ./tools/render
    image: sanad-render:${SANAD_INSTANCE:-sanad}
    working_dir: /app
    volumes:
      - .:/app
    # Renders local files only; no network at all.
    network_mode: none

networks:
  backend:
    internal: true
  # Published network for web (and the e2e browser that talks to it). Has internet access.
  edge: {}
  # Internet access for containers that never see document content: the node tools
  # container today; ollama-init (pulls weights) later; api only in the opt-in API-LLM override.
  egress: {}

volumes:
  db_data:
  frontend_node_modules:

# Sanad web server: serves the built SPA and proxies /api to the api service.
# Installed as /etc/nginx/conf.d/default.conf in the nginx-unprivileged image (listens on 8080).

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; re-resolve `api` so an api restart (new IP) doesn't break proxying.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Uploads arrive here first. Keep this >= the API's upload size limit (B3).
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Same-origin everything: no CDN, no external fonts, no analytics. The browser enforces it.
    # No location below uses add_header (that would drop these), so caching uses `expires`.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A CPU-only local LLM can take a while. Streaming (SSE) responses opt out of
        # buffering per response with the `X-Accel-Buffering: no` header.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The answer stream (SSE). The api already sends `X-Accel-Buffering: no`; this location
    # makes the rest explicit: no buffering or caching, no compression, and a read timeout
    # well above the api's 15 s keep-alive pings, since a CPU answer can take minutes.
    location = /api/ask/stream {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Hashed build assets never change, so cache them for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes all serve the SPA shell, which must never be cached stale.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
